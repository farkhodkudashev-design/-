
<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Восстановление пароля — NEXORA</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="responsive.css"></head>
<body>
<header class="header"><div class="header-main container"><a href="index.html" class="logo">NEX<span>ORA</span><i>.</i></a></div></header>
<main class="container auth-wrap">
<section class="auth-card">
<span class="eyebrow">ACCOUNT RECOVERY</span><h1>Восстановление доступа.</h1>
<p>Укажите email, связанный с аккаунтом.</p>
<form id="forgotForm" class="auth-form">
<label>Email<input type="email" id="recoveryEmail" required autocomplete="email"></label>
<button class="btn btn-dark" type="submit">Продолжить ↗</button>
</form>
<p id="recoveryStatus" style="margin-top:15px"></p>
<div class="auth-foot"><a href="login.html">Вернуться ко входу</a></div>
</section>
</main>
<script src="forgot-password.js"></script>
</body>
</html>
