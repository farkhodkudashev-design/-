    .order-card{padding:22px;margin-bottom:15px;border:1px solid var(--line);border-radius:15px;background:var(--surface)}

    .order-product{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px}
    .order-bottom{display:flex;justify-content:space-between;align-items:center;gap:15px;padding-top:15px;border-top:1px solid var(--line)}
