
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — NEXORA</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="responsive.css">
  <style>
    .auth-wrap{min-height:80vh;display:grid;place-items:center;padding:35px 0}
    .auth-card{width:min(440px,100%);padding:35px;border:1px solid var(--line);border-radius:20px;background:var(--surface)}
    .auth-card h1{font-size:36px;margin:20px 0 10px}
    .auth-card>p{color:var(--muted);font-size:12px}
    .auth-form{display:grid;gap:17px;margin-top:25px}
    .auth-form label{display:grid;gap:7px;font-size:11px;font-weight:700}
    .auth-form input:not([type=checkbox]){width:100%;padding:13px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text)}
    .auth-form .btn{width:100%}
    .auth-options{display:flex;justify-content:space-between;gap:10px;font-size:11px}
    .auth-options a,.auth-foot a{color:var(--accent-dark);font-weight:700}
    .auth-check{display:flex;align-items:center;gap:8px;font-weight:400!important}
    .auth-social{display:grid;gap:9px;margin-top:15px}
    .auth-social button{padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
    .auth-foot{text-align:center;margin-top:22px;font-size:12px}
    .auth-divider{text-align:center;color:var(--muted);font-size:10px;margin-top:15px}
  </style>
</head>
<body>
<header class="header"><div class="header-main container"><a href="index.html" class="logo">NEX<span>ORA</span><i>.</i></a><a href="index.html">← На главную</a></div></header>
<main class="container auth-wrap">
  <section class="auth-card">
    <span class="eyebrow">WELCOME BACK TO NEXORA</span>
    <h1>С возвращением!</h1>
    <p>Войдите в аккаунт, чтобы продолжить покупки.</p>
    <form class="auth-form" id="loginForm">
      <label>Email<input name="email" type="email" required autocomplete="email"></label>
      <label>Пароль<input name="password" type="password" required autocomplete="current-password"></label>
      <div class="auth-options">
        <label class="auth-check"><input type="checkbox" name="remember"> Запомнить меня</label>
        <a href="forgot-password.html">Забыли пароль?</a>
      </div>
      <button class="btn btn-dark" type="submit">Войти ↗</button>
    </form>
    <div class="auth-divider">ИЛИ</div>
    <div class="auth-social">
      <button type="button" data-social="Google">G &nbsp; Войти через Google</button>
      <button type="button" data-social="Apple">● &nbsp; Войти через Apple</button>
    </div>
    <div class="auth-foot">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></div>
  </section>
</main>
<div class="toast-container" id="toastContainer"></div>
<script src="js/auth.js"></script>
</body>
</html>
